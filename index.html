:root{
  --pri:#c2187f;--pri-d:#9a0f63;--pri-l:#fde6f3;--herobg:linear-gradient(135deg,#ffe0f0,#efe0ff);
  --bg:#faf3f9;--card:#ffffff;--ink:#2a1236;--mute:#5e4a6b;--line:#ecdcea;
  --blue:#6a1fa0;--green:#1b7a3d;--gold:#ffc83d;--gold-ink:#7a4a00;--purple:#8e2bb5;--orange:#c25e00;--rose:#d6336c;
  --ok:#157a3a;--okbg:#e6f6ec;--bad:#b3261e;--badbg:#fdecea;
  --shadow:0 4px 0 rgba(0,0,0,.08),0 8px 22px rgba(0,0,0,.08);

}
:root[data-theme="dark"]{
  --pri:#ff6fb8;--pri-d:#c2187f;--pri-l:#3a1236;--herobg:linear-gradient(135deg,#3a1244,#2a1540);
  --bg:#170a26;--card:#251238;--ink:#f7eefc;--mute:#cbb9d9;--line:#3d2555;
  --blue:#d9a6ff;--green:#5ccf86;--gold:#ffc83d;--gold-ink:#ffe28a;--purple:#c58bff;--orange:#ffa94d;--rose:#ff8fb8;
  --ok:#5ccf86;--okbg:#17301f;--bad:#ff8a80;--badbg:#3a1d1b;
  --shadow:0 4px 0 rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.35);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --pri:#ff6fb8;--pri-d:#c2187f;--pri-l:#3a1236;--herobg:linear-gradient(135deg,#3a1244,#2a1540);
    --bg:#170a26;--card:#251238;--ink:#f7eefc;--mute:#cbb9d9;--line:#3d2555;
    --blue:#d9a6ff;--green:#5ccf86;--gold:#ffc83d;--gold-ink:#ffe28a;--purple:#c58bff;--orange:#ffa94d;--rose:#ff8fb8;
    --ok:#5ccf86;--okbg:#17301f;--bad:#ff8a80;--badbg:#3a1d1b;
    --shadow:0 4px 0 rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.6 var(--font);-webkit-text-size-adjust:100%}
a{color:var(--blue)}
button{font:inherit;cursor:pointer}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:100}
.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
/* Kopf */
.top{background:linear-gradient(90deg,#2a0e45,#6a1fa0 55%,#a0127a);color:#fff;position:sticky;top:0;z-index:20}.top::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:linear-gradient(90deg,#ff6fb8,#c2187f,#6a1fa0)}
.topin{max-width:1060px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:800;font-size:1.15rem;letter-spacing:.2px;min-height:44px;background:none;border:0;padding:0}
.brand .dot svg{width:24px;height:auto;display:block}.brand .dot{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--pri-d);display:grid;place-items:center;font-size:1.2rem;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.brand{text-align:left;line-height:1.2}.brand small{display:block;font-weight:800;font-size:.98rem;opacity:1;letter-spacing:.1px;margin-top:2px;line-height:1.25}
.spacer{flex:1}
.pill{background:rgba(0,0,0,.2);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.9rem;white-space:nowrap}
.lang{display:flex;gap:6px}
.lang button,.theme{min-height:44px;min-width:44px;padding:6px 12px;border-radius:999px;border:2px solid rgba(255,255,255,.7);background:transparent;color:#fff;font-weight:700}
.lang button[aria-pressed="true"]{background:#fff;color:#2a0e45}
.certitem{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}.certrow{display:flex;gap:8px;align-items:stretch}.certrow .certbar{flex:1}.sharecert.sm{min-height:44px;padding:6px 14px;white-space:nowrap}
.nextcol{display:flex;flex-direction:column;gap:10px;align-items:stretch;flex:1 1 100%;max-width:560px}.nextcol .btn{justify-content:center}
.sharecert{gap:10px;display:inline-flex;align-items:center}.sharecert .shico{display:inline-flex;flex:none}.sharecert .shico svg{display:block}
.sharecert.big{min-height:64px;padding:12px 28px;font-size:1.15rem;font-weight:800;line-height:1.25;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.22),0 12px 28px rgba(194,24,127,.38)}
.sharecert.big:hover{transform:translateY(-1px)}
.btn.mini{min-height:40px;padding:6px 16px;font-size:.92rem;font-weight:700;box-shadow:none;opacity:.92}
.theme.off{position:relative;opacity:.75}.theme.off::after{content:"";position:absolute;left:9px;right:9px;top:50%;height:3px;border-radius:2px;background:#fff;box-shadow:0 0 0 1.5px var(--pri);transform:rotate(-45deg)}
.theme{font-size:1.1rem;padding:0;display:inline-flex;align-items:center;justify-content:center;line-height:1}.theme svg{display:block;flex:none}
/* Layout */
main{max-width:1060px;margin:0 auto;padding:20px 16px 24px;outline:none}
.hero{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;position:relative;overflow:hidden;border:2px solid var(--line)}
.hero::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--herobg)}
.hero>*{position:relative}

.stats{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700}
.chip.coin b{color:#3b2d00;background:var(--gold);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:.8rem}
.ring{--p:0;width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;transition:background .6s}
.ring span{width:84px;height:84px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:1.3rem}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.lcard{--c:var(--pri);text-align:left;background:var(--card);border:2px solid var(--line);border-top:8px solid var(--c);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);color:var(--ink);display:flex;flex-direction:column;gap:6px;min-height:170px;transition:transform .18s,box-shadow .18s;animation:pop .5s both}
.lcard:hover{transform:translateY(-4px) rotate(-.4deg)}
.lcard:active{transform:translateY(1px)}
.lcard .ico{font-size:2rem;line-height:1}
.lcard h3{margin:0;font-size:1.08rem;line-height:1.3}

.stars{letter-spacing:2px;font-size:1.15rem}
.stars .off{opacity:.3;filter:grayscale(1)}
.nr{font-weight:800;color:var(--c)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 22px;border-radius:999px;border:0;background:var(--pri-d);color:#fff;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .12s,box-shadow .12s;text-decoration:none}
:root[data-theme="dark"] .btn{background:#9a0f63}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{background:#9a0f63}}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.ghost{background:var(--card)!important;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 rgba(0,0,0,.08)}
.crumb{display:flex;gap:12px;flex-wrap:nowrap;align-items:center;margin:0 0 16px;min-width:0}
.ctx{flex:1;min-width:0;color:var(--mute);font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:inline-flex;align-items:center;gap:4px;flex:none;min-height:44px;padding:8px 16px 8px 8px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.08);transition:transform .12s}
.back svg{color:var(--pri);flex:none}
.back:hover{transform:translateX(-2px)}.back:active{transform:translateY(2px);box-shadow:none}
/* Lektion */
.lhead{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.lhead .big{font-size:3rem;animation:wob 2.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(-4px)}}
.lhead h1{margin:0;font-size:clamp(1.4rem,4.5vw,2rem);line-height:1.25}
.lhead p{margin:0;color:var(--mute)}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:0 0 14px;box-shadow:var(--shadow);animation:pop .5s both}
.card h2{margin:0 0 6px;font-size:1.1rem}
.card p{margin:0}
.card .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--pri-d);color:#fff;font-weight:800;margin-right:8px;font-size:.9rem}
.bubble{background:var(--gold);color:#3b2d00;border-radius:22px;padding:14px 18px;margin:18px 0 22px;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.14);animation:pop .5s .25s both}
:root[data-theme="dark"] .bubble{color:#2a2000}
.bubble small{display:block;font-weight:800;letter-spacing:.5px;text-transform:uppercase;font-size:.75rem;margin-bottom:2px}
details.pro{background:var(--card);border:2px dashed var(--c,var(--pri));border-radius:var(--r);padding:0;margin:0 0 14px}
details.pro summary{min-height:48px;padding:12px 18px;font-weight:800;cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center}
details.pro summary::-webkit-details-marker{display:none}
details.pro summary::before{content:"\1F3C6";font-size:1.2rem}
details.pro[open] summary::before{content:"\2B50"}
details.pro p{margin:0;padding:0 18px 16px}
.src{font-size:.9rem;color:var(--mute);margin:16px 0}
.src ul{margin:6px 0 0;padding-left:20px}
.src li{margin:4px 0}
.sticky{position:sticky;bottom:0;display:flex;justify-content:center;margin:28px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -8px 18px rgba(0,0,0,.07);z-index:10}.next{margin:16px 0 0}.next .btn{width:100%;min-height:52px;font-size:1.05rem}.sticky .btn{width:100%;max-width:420px;min-height:52px;font-size:1.05rem}
/* Quiz */
.dots{display:flex;gap:6px;margin:0 0 16px}
.dots i{flex:1;height:10px;border-radius:99px;background:var(--line);transition:background .3s}
.dots i.on{background:var(--ok)}
.dots i.no{background:var(--bad)}
.dots i.cur{background:var(--blue)}
.qq{font-size:clamp(1.15rem,3.8vw,1.5rem);line-height:1.35;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;min-height:56px;padding:12px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.08);transition:transform .12s,border-color .12s}
.opt:hover:not(:disabled){border-color:var(--blue);transform:translateX(3px)}
.opt .k{flex:none;width:32px;height:32px;border-radius:50%;background:var(--bg);border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:.9rem}
.opt.right{background:var(--okbg);border-color:var(--ok);animation:hop .45s}
.opt.wrong{background:var(--badbg);border-color:var(--bad);animation:shake .4s}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.dim{opacity:.7}
@keyframes hop{30%{transform:scale(1.03) translateY(-4px)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin:16px 0 0;padding:14px 16px;border-radius:16px;font-weight:600}
.fb.ok{background:var(--okbg);border:2px solid var(--ok)}
.fb.bad{background:var(--badbg);border:2px solid var(--bad)}
.fb b{display:block;margin-bottom:2px}
.res{text-align:center;padding:10px 0}
.res .bigstars{display:inline-block;font-size:2.6rem;line-height:1.3;letter-spacing:6px;color:#ffc800;background:#26272e;border-radius:999px;padding:2px 22px 0 28px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.res .bigstars span{display:inline-block;animation:star .6s both}
.res .bigstars span:nth-child(2){animation-delay:.2s}.res .bigstars span:nth-child(3){animation-delay:.4s}
.res .bigstars .off{animation:none;color:#8a8c92}
@keyframes star{from{transform:scale(0) rotate(-180deg)}to{transform:none}}
.res h1{margin:6px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
footer{max-width:1060px;margin:34px auto 0;padding:0 16px 40px;color:var(--mute);font-size:.88rem}
footer p{margin:6px 0}
.srccard{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px 18px;margin:0 0 14px;box-shadow:var(--shadow)}
.srch{display:flex;align-items:center;gap:10px;margin-bottom:10px}.srch .si{font-size:1.4rem;line-height:1}.srch b{font-size:1rem;color:var(--ink)}
.srclist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.srclist a{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--blue);font-weight:700;font-size:.9rem;text-decoration:none}
.srclist a::after{content:"↗";font-weight:800}
.srclist a:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.srclist a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.fcard{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px 20px;box-shadow:var(--shadow)}
.fcard .fic{font-size:1.5rem;line-height:1.3;flex:none}
.fcard p{margin:0 0 8px;line-height:1.55}.fcard p:last-child{margin-bottom:0}
.fcard .ftrans{padding-top:8px;border-top:1px dashed var(--line)}
footer .fver{text-align:center;margin:14px 0 0;font-size:.82rem}
footer .fver span{display:inline-block;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 16px;font-weight:700}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.conf i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:560px){
  .brand{flex:1 1 0;min-width:0}.brand small{white-space:normal}.pill{display:none}.topin .lang{order:3;flex:1 1 100%}.lang button{flex:1;min-width:0}.spacer{display:none}.pill{margin-left:auto}.chip{padding:3px 11px;font-size:.84rem;min-height:40px}button.chip{min-height:40px}.stats{gap:8px}.hero::before{width:130px;height:130px;right:-46px;top:-46px;opacity:.75}.hero{padding:16px;gap:12px}.ring{width:72px;height:72px}.ring span{width:54px;height:54px;font-size:1rem}.hero p{font-size:.95rem}
  .topin{padding:8px 12px}
  main{padding:14px 12px 24px}
}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0 4px}
.choices:has(.choice:only-child){grid-template-columns:1fr}
.choice{display:flex;gap:14px;align-items:center;text-align:left;min-height:84px;padding:14px 20px;border-radius:22px;border:2px solid var(--line);background:var(--card);color:var(--ink);box-shadow:var(--shadow);transition:transform .15s;animation:pop .5s .1s both}

.choice .ci{font-size:2.2rem;line-height:1}
.choice b{display:block;font-size:1.15rem}
.choice small{display:block;font-size:.92rem;opacity:.92}
.choice.pri{background:var(--pri-d);color:#fff;border-color:transparent}
.ach{margin-top:10px;padding:10px 14px;border-radius:14px;background:var(--gold);color:#3b2d00;font-weight:800;animation:pop .5s both}
.nameq{scroll-margin:90px 0 24px;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:14px 0 0;box-shadow:var(--shadow);display:grid;gap:6px;animation:pop .5s both}

.linkbtn{background:none;border:0;color:var(--blue);font-weight:800;text-decoration:underline;min-height:44px;padding:6px 8px}
.qp{margin:0 0 6px;font-weight:800;color:var(--blue)}
button.chip{font:inherit;font-weight:700;color:var(--ink);cursor:pointer;min-height:40px}
.nlink{display:inline-flex;align-items:center;min-height:44px;font-weight:800;color:var(--blue)}

 t:"Hello, I'm your heart", sub:"A muscle the size of your fist",
 cards:[
  ["I'm a muscle","I'm a hollow muscle, and I pump your blood all around your body. I sit behind your breastbone, roughly level with the 2nd to 5th rib, with my tip pointing a bit to the left."],
  ["Fist-sized and light","I'm about 15 centimeters long and the size of your clenched fist. In adults I weigh 300 grams on average, which is around 0.5 percent of your body weight. Men's hearts usually weigh 280 to 340 grams, women's hearts 230 to 280 grams."],
  ["My cozy coat","I live inside a sac called the pericardium. Between the sac and me there are only 10 to 20 milliliters of fluid. That's a lubricating film, so I can run smoothly around the clock."]
 ],
 pro:"For experts: My wall has three layers: the epicardium outside, the powerful heart muscle (myocardium) in the middle, and the endocardium inside. At the main left chamber I'm 9 millimeters thick on average, and 6 to 11 millimeters is normal.",

  {q:"Where exactly do I sit in your chest?",

   e:"I sit behind the breastbone at the level of the 2nd to 5th rib, and my tip points to the left."},
  {q:"What lies between my pericardium and me so that I run smoothly?",
   a:["A film of fluid, 10 to 20 milliliters","Half a liter of blood","A layer of air","A ring of cartilage"],
   e:"In the gap between the pericardium and the heart there are only 10 to 20 milliliters of fluid."}
 ]},
{ id:"bau", ico:"🏠", c:"var(--rose)", min:2,
 t:"How I'm built", sub:"Four rooms, four doors and a supply of my own",
 cards:[
  ["Four rooms","I have four hollow spaces: two atria on top and two ventricles below. A dividing wall separates my right half from my left half, so oxygen-poor and oxygen-rich blood never mix."],
  ["Four doors","My four heart valves work like one-way gates: the tricuspid valve (right side, between atrium and ventricle), the pulmonary valve (at the exit of the right ventricle), the mitral valve (left side, between atrium and ventricle) and the aortic valve (at the exit of the left ventricle). They make sure blood only flows one way."],
  ["My own supply","I need blood to work, too. Two coronary arteries branch off straight from the main artery and feed my muscle."]
 ],
 pro:"For experts: My right ventricle only pumps to the lungs and delivers 0.16 joules per beat. The left one pumps to your whole body and delivers 0.8 joules per beat, which is five times as much.",

 src:[{n:"Wikipedia: Heart", u:"https://de.wikipedia.org/wiki/Herz"}],

  {q:"Which valve sits at the exit of my left ventricle?",
   a:["The aortic valve","The pulmonary valve","The tricuspid valve","The mitral valve"],
   e:"The aortic valve sits at the exit of the left ventricle. The mitral valve comes before it, between the left atrium and the left ventricle."},
  {q:"What supplies me myself with blood?",
   a:["The coronary arteries","The pulmonary veins","The carotid artery","The vena cava"],
   e:"The right and left coronary arteries branch off the aorta and feed the heart muscle."},
  {q:"How much more work per beat does my left ventricle do compared to the right?",
   a:["About five times as much","Exactly the same","About twice as much","About ten times as much"],
   e:"On the left it's 0.8 joules per beat, on the right 0.16 joules: five times as much."}
 ]},
{ id:"kreislauf", ico:"🔄", c:"var(--blue)", min:2,
 t:"Two circuits, one heart", sub:"How much blood I move every day",
 cards:[
  ["The small circuit","My right half sends oxygen-poor blood to the lungs. Freshly refueled, it comes back to my left atrium through the pulmonary veins."],
  ["The big circuit","My left half pumps oxygen-rich blood through the aorta to your whole body. It returns to my right atrium through the venae cavae."],
  ["Numbers to marvel at","With each beat I push out about 70 cubic centimeters of blood. At rest I manage around 4.9 liters per minute. You have roughly five liters of blood, so I send almost all of it through you once every minute. Under heavy exertion I can reach 20 to 25 liters per minute."]

{ id:"takt", ico:"⏱️", c:"var(--purple)", min:3,
 t:"My pacemaker", sub:"How many times I've already beaten for you",
 cards:[
  ["I beat on my own","I don't need orders from the brain: the impulse arises all by itself in my pacemaker cells. The boss is called the sinus node, and it sits between the superior vena cava and the right auricle."],
  ["The current's road trip","From the sinus node, the impulse travels across the atria to the AV node, then through the bundle of His and the Tawara branches all the way to the Purkinje fibers. The AV node is my backup boss: if the sinus node drops out, it keeps the beat going at about 40 beats per minute."],
  ["How often do I beat for you?","At around 70 beats per minute, that's about 100,000 beats a day, almost 37 million a year and roughly 2.9 billion in 80 years. The ECG records the whole electrical activity of my heart as it goes."]
 ],
 pro:"For experts: My daily work comes to about 100,000 joules. On paper, that's enough to lift 100 kilograms about 100 meters high, every single day, without a warm-up.",
 fun:"Herzi: I don't beat because I have to, I beat because I like you. And because the sinus node gets grumpy otherwise.",
 src:[{n:"Wikipedia: Heart", u:"https://de.wikipedia.org/wiki/Herz"}],

   e:"The impulse arises on its own in the pacemaker cells of the sinus node."},
  {q:"How often have I beaten for you?",
   a:["About 100,000 times a day","About 1,000 times a day","About 10 million times a day","About 500 times a day"],
   e:"At around 70 beats per minute, that's about 100,000 beats a day and almost 37 million a year."},
  {q:"Who steps in when the sinus node drops out?",
   a:["The AV node, at about 40 beats per minute","The lungs","The brain","Nobody, I stop right away"],
   e:"The AV node provides a backup rhythm of about 40 beats per minute."},
  {q:"What does an ECG record?",
   a:["The electrical activity of my heart","Your blood pressure","The sounds of the heart valves","The amount of blood in the lungs"],
   e:"The ECG shows the overall electrical activity of the heart."}
 ]},
{ id:"stolpern", ico:"💓", c:"var(--orange)", min:2,
 t:"When I lose the beat", sub:"Too slow, too fast and the oxygen",
 cards:[
  ["Too slow, too fast","If I beat fewer than 60 times a minute at rest, it's called bradycardia. If I beat more than 100 times a minute at rest in adults, it's called tachycardia. During exertion, though, my pulse may climb above 200, and that's normal."],
  ["Stumbles in the rhythm","If the path of the current is disturbed, names like atrial fibrillation, atrial flutter or AV block come up. In an AV block, the signals from the atria don't reach the ventricles properly."],
  ["My muscle has limits","From about 500 grams of heart weight, the risk goes up that I won't get enough oxygen anymore. If you're worried about your heartbeat, please ask a doctor: I'm just a quiz."]
 ],
 pro:"For experts: My ventricles fill about 70 to 80 percent passively with blood, no heavy lifting needed. And in newborns I beat much faster: over 120 to 160 times a minute.",
 fun:"Herzi: Even I skip a beat now and then, like when you really like someone. But that's a different topic and no job for the AV node.",
 src:[{n:"Wikipedia: Heart", u:"https://de.wikipedia.org/wiki/Herz"}],
 q:[
  {q:"What is it called when an adult has fewer than 60 heartbeats per minute at rest?",
   a:["Bradycardia","Tachycardia","Hypertrophy","Systole"],
   e:"Below 60 beats at rest is called bradycardia, and above 100 beats at rest in adults is called tachycardia."},
  {q:"How high may my pulse climb under heavy exertion?",
   a:["Above 200 per minute","No higher than 100","No higher than 120","It may not climb at all"],
   e:"Under strain, the heart rate can climb above 200 per minute."},
  {q:"What share of the filling do my ventricles do all by themselves?",
   a:["About 70 to 80 percent","About 10 percent","100 percent","None, everything is pumped"],
   e:"The ventricles fill passively to about 70 to 80 percent."},
  {q:"What is the disorder called in which signals from the atria don't properly reach the ventricles?",
   a:["AV block","Pericardium","Mitral valve","Sinus arch"],
   e:"In an AV block, the conduction from atrium to ventricle is disturbed."}
 ]},

  ["One heart, three hearts, many hearts","Insects have a tube-shaped heart near the back, and some have extra hearts in their wings, legs and antennae. Squid and octopus have a main heart and two gill hearts, so that's three hearts."],

/* Feste Orientierungsleiste: Hoehen messen, Schatten nur wenn festgeheftet */

{ const _render = render; render = function(...a){ const r = _render.apply(this, a); linkeNeu(); syncHH(); return r; }; }
